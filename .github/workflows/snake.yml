name: Generate Snake Game

on:
  schedule:
    # Runs every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write  # ✅ Needed to push the snake game file

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Adhityae-506   # ✅ Your username
          outputs: dist/snake.svg

      - name: Commit and Push Snake Game
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p output
          cp dist/snake.svg output/snake.svg
          git add output/snake.svg
          git commit -m "Generated Snake Game"
          git push
